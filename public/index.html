<style>

  /* ================================================================
     DOCUMENTO PDF / IMPRESIÓN
     Estilos planos (hex, sin oklch) para que html2canvas los rasterice bien.
     ================================================================ */
  /* El desplazamiento fuera de pantalla va en el WRAPPER, no en #print-doc.
     html2pdf clona el nodo copiando sus estilos de posición: si #print-doc
     estuviera posicionado, quedaría fuera del contenedor de render y el PDF
     saldría en blanco (canvas de 794x0). #print-doc debe ir en flujo normal. */
  #print-wrap {
    position: absolute; left: -10000px; top: 0;
    width: 794px; background: #ffffff;
  }
  #print-doc {
    width: 794px;                 /* A4 @ 96dpi */
    padding: 46px 54px 40px;
    background: #ffffff; color: #1f2933;
    font-family: Inter, Arial, Helvetica, sans-serif;
    font-size: 11.2px; line-height: 1.5;
  }
  #print-doc .p-name { font-size: 27px; font-weight: 800; color: #111827; text-align: center; letter-spacing: -.3px; }
  #print-doc .p-role { font-size: 14px; color: #3730a3; text-align: center; margin-top: 3px; }
  #print-doc .p-contact { font-size: 10.4px; color: #4b5563; text-align: center; margin-top: 8px; }
  #print-doc .p-contact span { white-space: nowrap; }
  #print-doc .p-sec { font-size: 11.5px; font-weight: 700; color: #3730a3; letter-spacing: .9px;
                      text-transform: uppercase; margin: 17px 0 6px;
                      border-bottom: 1.6px solid #3730a3; padding-bottom: 3px; }
  #print-doc .p-sum { text-align: justify; }
  #print-doc .p-job { margin-top: 10px; page-break-inside: avoid; }
  #print-doc .p-job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #print-doc .p-job-title { font-size: 12.6px; font-weight: 700; color: #111827; }
  #print-doc .p-job-dates { font-size: 10.2px; color: #6b7280; white-space: nowrap; }
  #print-doc .p-job-org { font-size: 11px; color: #4338ca; margin-top: 1px; }
  #print-doc .p-job ul { margin: 5px 0 0; padding-left: 15px; list-style: disc; }
  #print-doc .p-job li { margin: 2.5px 0; }
  #print-doc .p-row { margin: 3px 0; }
  #print-doc .p-row b { color: #111827; }
  #print-doc .p-muted { color: #4b5563; }

  /* Fallback: Ctrl+P imprime el mismo documento */
  @media print {
    body > *:not(#print-wrap) { display: none !important; }
    #print-wrap { position: static !important; left: 0 !important; width: auto !important; }
    #print-doc { width: auto !important; padding: 0 !important; }
    @page { size: A4; margin: 14mm 15mm; }

<script>
/* ==================================================================
   1. DATOS DEL CV (bilingüe) — única fuente de verdad del frontend
   ================================================================== */
/* ==================================================================
   1. CV BASE
   La fuente de verdad vive en KV y se sirve por /api/cv. Aquí solo queda la
   proyección a un idioma y la aplicación de la variante encima.
   ================================================================== */
let baseCV = null;   // se rellena en el arranque

const SECTIONS = {
  es: { sum:'PERFIL PROFESIONAL', exp:'EXPERIENCIA', skills:'APTITUDES',
        edu:'EDUCACIÓN', certs:'CERTIFICACIONES', lang:'IDIOMAS' },
  en: { sum:'PROFESSIONAL SUMMARY', exp:'EXPERIENCE', skills:'SKILLS',
        edu:'EDUCATION', certs:'CERTIFICATIONS', lang:'LANGUAGES' }
};

/** Aplana el CV bilingüe a un solo idioma, conservando los ids. */
function project(base, l) {
  return {
    name: base.name,
    email: base.email,
    phone: base.phone,
    linkedin: base.linkedin,
    linkedinLabel: base.linkedinLabel,
    location: base.location[l],
    headline: base.headline[l],
    summary: base.summary[l],
    experience: base.experience.map((j) => ({
      id: j.id, org: j.org, title: j.title[l], place: j.place[l], dates: j.dates[l],
      bullets: j.bullets.map((b) => ({ id: b.id, text: b[l] })).filter((b) => b.text)
    })),
    skills: base.skills.map((g) => ({ id: g.id, label: g.label[l], items: g.items })),
    education: { degree: base.education.degree[l], school: base.education.school },
    certs: base.certs,
    languages: base.languages[l],
    metrics: base.metrics.map((m) => ({ value: m.value, label: m[l] })),
    secSum: SECTIONS[l].sum, secExp: SECTIONS[l].exp, secSkills: SECTIONS[l].skills,
    secEdu: SECTIONS[l].edu, secCerts: SECTIONS[l].certs, secLang: SECTIONS[l].lang
  };
}

/* ==================================================================
   2. CADENAS DE INTERFAZ
   ================================================================== */
const UI = {
  es: {
    pdfBtn: 'Descargar CV',
    tabExp: 'Experiencia', tabSkills: 'Aptitudes', tabEdu: 'Educación',
    mYears: 'años de experiencia', mTeam: 'ingenieros liderados',
    mTesting: 'tiempo de testing', mLoad: 'carga de módulos críticos',
    chatTitle: 'Pregúntale a mi CV', chatSub: 'Asistente de IA · responde en tu idioma',
    placeholder: 'Escribe tu pregunta…',
    greeting: '¡Hola! 👋 Soy el asistente de IA de este CV. Puedes preguntarme sobre la experiencia, el stack técnico, cómo se aplica IA en desarrollo o si encaja con una vacante. Escríbeme en **español o inglés** — respondo en el idioma que uses.',
    typing: 'Escribiendo',
    disclaimer: 'Respuestas generadas con IA a partir del CV. Pueden contener imprecisiones.',
    footer: 'Construido con Cloudflare Workers AI · Llama 3.3',
    errNetwork: 'No pude conectar con el asistente. Revisa tu conexión e inténtalo de nuevo.',
    errEmpty: 'No obtuve respuesta del modelo. Intenta reformular la pregunta.',
    pdfName: 'CV_ES.pdf',
    pdfWorking: 'Generando…',
    suggestions: [
      '¿Cómo aplica la IA en su día a día?',
      '¿Qué experiencia tiene liderando equipos?',
      'Resume su stack técnico',
      '¿Encaja para un rol de Engineering Manager?',
      '¿Cuáles son sus logros más medibles?'
    ]
  },
  en: {
    pdfBtn: 'Download CV',
    tabExp: 'Experience', tabSkills: 'Skills', tabEdu: 'Education',
    mYears: 'years of experience', mTeam: 'engineers led',
    mTesting: 'testing time', mLoad: 'critical module load',
    chatTitle: 'Ask my résumé', chatSub: 'AI assistant · replies in your language',
    placeholder: 'Type your question…',
    greeting: "Hi! 👋 I'm the AI assistant for this résumé. Ask me about the experience, tech stack, how AI is applied in development, or whether it fits a role you're hiring for. Write in **English or Spanish** — I answer in whichever you use.",
    typing: 'Typing',
    disclaimer: 'AI-generated answers based on the résumé. May contain inaccuracies.',
    footer: 'Built with Cloudflare Workers AI · Llama 3.3',
    errNetwork: "I couldn't reach the assistant. Check your connection and try again.",
    errEmpty: 'No response from the model. Try rephrasing your question.',
    pdfName: 'CV_EN.pdf',
    pdfWorking: 'Generating…',
    suggestions: [
      'How does he use AI in development?',
      'What is his team leadership experience?',
      'Summarize his tech stack',
      'Is he a fit for an Engineering Manager role?',
      'What are his most measurable achievements?'
    ]
  }
};

const BADGES = ['PHP','Symfony','Python','TypeScript','React','PostgreSQL','Redis','Docker','Kubernetes','Playwright','AI Agents','MCP'];

/* ==================================================================
   3. ESTADO Y UTILIDADES
   ================================================================== */
let lang = localStorage.getItem('cv-lang')
  || ((navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es');
let activeTab = 'exp';
let history = [];      // [{role,content}] enviado al Worker
let busy = false;
let variant = null;    // variante de CV para una vacante (ruta /v/:id)

/** Id de variante en la URL: /v/abc123 */
const variantId = (location.pathname.match(/^\/v\/([a-z0-9-]{3,40})\/?$/) || [])[1] || null;

/**
 * CV del idioma pedido con la variante aplicada encima.
 *
 * La variante solo puede sustituir titular y resumen, y reordenar u ocultar
 * elementos que ya existen, referenciándolos por su id estable. Un id que ya no
 * está en el CV (logro borrado) se ignora sin romper nada.
 */
function cvFor(l) {
  const base = project(baseCV, l);
  if (!variant) return base;

  const over = variant[l] || {};
  const out = { ...base };
  if (over.headline) out.headline = over.headline;
  if (over.summary) out.summary = over.summary;

  if (variant.bulletOrder) {
    out.experience = base.experience.map((job) => {
      const order = variant.bulletOrder[job.id];
      if (!Array.isArray(order) || !order.length) return job;
      const byId = new Map(job.bullets.map((b) => [b.id, b]));
      const bullets = order.map((id) => byId.get(id)).filter(Boolean);
      return bullets.length ? { ...job, bullets } : job;
    });
  }

  if (Array.isArray(variant.skillOrder) && variant.skillOrder.length) {
    const byId = new Map(base.skills.map((g) => [g.id, g]));
    const skills = variant.skillOrder.map((id) => byId.get(id)).filter(Boolean);
    if (skills.length) out.skills = skills;
  }

  return out;
}

const badgesFor = () => (variant?.badges?.length ? variant.badges : baseCV.badges);
const suggestionsFor = (l) =>
  variant?.[l]?.suggestions?.length ? variant[l].suggestions : UI[l].suggestions;

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/** Markdown -> HTML saneado (con degradación si el CDN no cargó). */
function renderMarkdown(text) {
  if (window.marked && window.DOMPurify) {
    const html = marked.parse(text, { breaks: true, gfm: true });
    return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
  }
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

/* ==================================================================
   4. TEMA
   ================================================================== */
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem('cv-theme', dark ? 'dark' : 'light');
}
applyTheme(
  localStorage.getItem('cv-theme')
    ? localStorage.getItem('cv-theme') === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches
);
$('#theme-toggle').addEventListener('click', () =>

function renderContact() {
  const cv = cvFor(lang);
  const chip = 'inline-flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 px-3 py-2 text-sm font-medium hover:border-brand-500 hover:text-brand-700 dark:hover:text-brand-300 transition-colors';
  const icon = {
    mail: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>',
    tel:  '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.2a2 2 0 012.1-.5c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>',
    li:   '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 112.5 6 2.5 2.5 0 014.98 3.5zM3 8.98h4V21H3zM9 8.98h3.8v1.64h.05A4.17 4.17 0 0117 8.6c4 0 4.75 2.63 4.75 6.05V21h-4v-5.5c0-1.31-.02-3-1.83-3s-2.11 1.43-2.11 2.9V21H9z"/></svg>'
  };
  const links = [];
  if (cv.email) links.push(`<a href="mailto:${esc(cv.email)}" class="${chip}">${icon.mail}${esc(cv.email)}</a>`);
  if (cv.phone) links.push(`<a href="tel:${esc(cv.phone.replace(/[^+0-9]/g, ''))}" class="${chip}">${icon.tel}${esc(cv.phone)}</a>`);
  if (cv.linkedin) links.push(`<a href="${esc(cv.linkedin)}" target="_blank" rel="noopener noreferrer" class="${chip}">${icon.li}LinkedIn</a>`);
  $('#contact').innerHTML = links.join('');

  $('#cv-name').textContent = cv.name;
  document.title = `${cv.name} — ${cv.headline}`;
}

        <div class="flex flex-wrap items-baseline justify-between gap-x-3">

    edu: () => `

          <p class="font-semibold text-slate-900 dark:text-white">${esc(cv.education.degree)}</p>
          <p class="text-sm text-slate-500 dark:text-slate-400">${esc(cv.education.school)}</p>
        </div>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">${esc(cv.secCerts)}</h3>
          <ul class="text-sm text-slate-600 dark:text-slate-300 list-disc pl-4 marker:text-brand-400">
            ${cv.certs.map((c) => `<li>${esc(c)}</li>`).join('')}
          </ul>
        </div>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">${esc(cv.secLang)}</h3>
          <ul class="text-sm text-slate-600 dark:text-slate-300 list-disc pl-4 marker:text-brand-400">

          </ul>

      </div>`
  };

  $('#tab-panels').innerHTML = `<div class="animate-fadeUp">${panels[activeTab]()}</div>`;

  $$('.tab-btn').forEach((btn) => {
    const on = btn.dataset.tab === activeTab;
    btn.className = 'tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg whitespace-nowrap transition-colors ' +
      (on ? 'bg-brand-50 text-brand-800 dark:bg-brand-900/50 dark:text-brand-200'

function renderSuggestions() {
  $('#suggestions').innerHTML = suggestionsFor(lang).map((q) =>
    `<button type="button" class="suggestion text-xs px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-700
      text-slate-600 dark:text-slate-300 hover:border-brand-500 hover:text-brand-700 dark:hover:text-brand-300 transition-colors">${esc(q)}</button>`

function renderLangButtons() {
  $$('[data-lang-btn]').forEach((btn) => {
    const on = btn.dataset.langBtn === lang;
    btn.classList.toggle('bg-brand-700', on);
    btn.classList.toggle('text-white', on);
    btn.classList.toggle('text-slate-500', !on);
    btn.setAttribute('aria-pressed', on);
  });
}

function applyLanguage() {
  const t = UI[lang], cv = cvFor(lang);
  document.documentElement.lang = lang;

  $$('[data-i18n]').forEach((el) => {
    const key = el.dataset.i18n;
    el.textContent = t[key] ?? cv[key] ?? '';
  });

  $('#summary').textContent = cv.summary;
  $('#chat-input').placeholder = t.placeholder;
  localStorage.setItem('cv-lang', lang);

  renderLangButtons();
  renderContact();
  renderMetrics();
  renderBadges();
  renderTabs();
  renderSuggestions();
  buildPrintDoc();
  resetChat();
}

/* ==================================================================
   6. CHAT
   ================================================================== */
const chatLog = $('#chat-log');
const chatInput = $('#chat-input');
const chatSend = $('#chat-send');

function scrollChat() { chatLog.scrollTop = chatLog.scrollHeight; }

function addBubble(role, content = '') {
  const wrap = document.createElement('div');
  wrap.className = 'animate-fadeUp flex ' + (role === 'user' ? 'justify-end' : 'justify-start');

  const bubble = document.createElement('div');
  bubble.className = 'md max-w-[88%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ' +
    (role === 'user'
      ? 'bg-brand-700 text-white rounded-br-md whitespace-pre-wrap'
      : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-bl-md');

  // El texto del usuario se inserta como texto plano; el del asistente, como Markdown saneado.
  if (role === 'user') bubble.textContent = content;
  else bubble.innerHTML = renderMarkdown(content);

  wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  scrollChat();
  return bubble;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.id = 'typing';
  wrap.className = 'animate-fadeUp flex justify-start';
  wrap.innerHTML = `
    <div class="bg-slate-100 dark:bg-slate-800 rounded-2xl rounded-bl-md px-4 py-3 flex items-center gap-2">
      <span class="text-xs text-slate-500 dark:text-slate-400">${esc(UI[lang].typing)}</span>
      <span class="flex gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-blink"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-blink" style="animation-delay:.2s"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-blink" style="animation-delay:.4s"></span>
      </span>
    </div>`;
  chatLog.appendChild(wrap);
  scrollChat();
}
const removeTyping = () => $('#typing')?.remove();

function setBusy(state) {
  busy = state;
  chatSend.disabled = state;
  chatInput.disabled = state;
}

function resetChat() {
  history = [];
  chatLog.innerHTML = '';
  addBubble('assistant', UI[lang].greeting);
}

async function sendMessage(text) {
  const message = text.trim();
  if (!message || busy) return;

  addBubble('user', message);
  history.push({ role: 'user', content: message });

  chatInput.value = '';
  chatInput.style.height = 'auto';
  setBusy(true);
  addTyping();

  let bubble = null;
  let answer = '';

  const paint = (chunk) => {
    answer += chunk;
    if (!bubble) { removeTyping(); bubble = addBubble('assistant', ''); }
    bubble.innerHTML = renderMarkdown(answer);
    scrollChat();
  };

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-8), lang, variantId })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err?.message?.[lang] || UI[lang].errNetwork;
      removeTyping();
      addBubble('assistant', msg);
      setBusy(false);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();                       // fragmento incompleto

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const obj = JSON.parse(payload);
          if (obj.response) paint(obj.response);
        } catch { /* keep-alive o fragmento parcial */ }
      }
    }

    removeTyping();
    if (!answer.trim()) {
      addBubble('assistant', UI[lang].errEmpty);
    } else {
      history.push({ role: 'assistant', content: answer });
    }
  } catch (e) {
    console.error(e);
    removeTyping();
    addBubble('assistant', UI[lang].errNetwork);
  } finally {
    setBusy(false);
    chatInput.focus();
  }
}

$('#chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(chatInput.value);
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(chatInput.value); }
});

chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 128) + 'px';
});

$('#suggestions').addEventListener('click', (e) => {
  const btn = e.target.closest('.suggestion');
  if (btn) sendMessage(btn.textContent);
});

/* ==================================================================
   7. DOCUMENTO PDF
   ================================================================== */

          .map((x) => `<span>${esc(x)}</span>`).join(' &nbsp;•&nbsp; ')}
    </div>

    <div class="p-sec">${esc(cv.secSum)}</div>
    <div class="p-sum">${esc(cv.summary)}</div>

    <div class="p-sec">${esc(cv.secExp)}</div>
    ${cv.experience.map((job) => `
      <div class="p-job">
        <div class="p-job-head">
          <span class="p-job-title">${esc(job.title)}</span>
          <span class="p-job-dates">${esc(job.dates)}</span>
        </div>
        <div class="p-job-org">${esc(job.org)} • ${esc(job.place)}</div>
        <ul>${job.bullets.map((b) => `<li>${esc(b.text)}</li>`).join('')}</ul>
      </div>`).join('')}

    <div class="p-sec">${esc(cv.secSkills)}</div>
    ${cv.skills.map((g) => `<div class="p-row"><b>${esc(g.label)}:</b> <span class="p-muted">${g.items.map(esc).join(' · ')}</span></div>`).join('')}

    <div class="p-sec">${esc(cv.secEdu)}</div>
    <div class="p-row">${esc(cv.education.degree)}<br><span class="p-muted">${esc(cv.education.school)}</span></div>

    <div class="p-sec">${esc(cv.secCerts)}</div>
    <div class="p-row p-muted">${cv.certs.map(esc).join(' · ')}</div>

    <div class="p-sec">${esc(cv.secLang)}</div>
    <div class="p-row p-muted">${cv.languages.map(esc).join(' · ')}</div>
  `;
}

$('#btn-pdf').addEventListener('click', async () => {
  const btn = $('#btn-pdf');
  const label = btn.querySelector('[data-i18n="pdfBtn"]');
  const original = label.textContent;

  // Sin html2pdf (CDN bloqueado) -> caemos al diálogo de impresión del navegador.
  if (typeof html2pdf === 'undefined') { window.print(); return; }

  btn.disabled = true;
  label.textContent = UI[lang].pdfWorking;

  const node = $('#print-doc');
  const wasDark = document.documentElement.classList.contains('dark');
  document.documentElement.classList.remove('dark');   // html2canvas hereda estilos del documento

  try {
    await html2pdf().set({
      margin: 0,
      filename: UI[lang].pdfName,
      image: { type: 'jpeg', quality: 0.98 },
      // Sin `windowWidth`: forzarlo descuadra el clon respecto al viewport real
      // y el PDF sale recortado por la izquierda.
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(node).save();
  } catch (e) {
    console.error('PDF export failed:', e);
    window.print();
  } finally {
    if (wasDark) document.documentElement.classList.add('dark');
    label.textContent = original;
    btn.disabled = false;
  }
});

/* ==================================================================
   8. ARRANQUE
   ================================================================== */
$$('[data-lang-btn]').forEach((btn) =>
  btn.addEventListener('click', () => {
    if (lang === btn.dataset.langBtn) return;
    lang = btn.dataset.langBtn;
    applyLanguage();
  })
);

$$('.tab-btn').forEach((btn) =>
  btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderTabs(); })
);

/**
 * Si la URL es /v/:id, carga la variante ANTES del primer render para evitar
 * que se vea el CV genérico y luego salte al adaptado.
 */
async function loadVariant() {
  if (!variantId) return;

  // Los CVs por vacante no deben indexarse ni descubrirse desde buscadores.
  const meta = document.createElement('meta');
  meta.name = 'robots';
  meta.content = 'noindex, nofollow';
  document.head.appendChild(meta);

  try {
    const res = await fetch(`/api/variant/${variantId}`);
    if (res.ok) variant = (await res.json()).variant;
    else console.warn('Variante no encontrada; se muestra el CV genérico.');
  } catch (e) {
    console.warn('No se pudo cargar la variante:', e.message);
  }
}

/** El CV base es obligatorio: sin él no hay nada que pintar. */
async function loadBaseCV() {
  const res = await fetch('/api/cv');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  baseCV = (await res.json()).cv;
}

(async () => {
  try {
    await loadBaseCV();
  } catch (e) {
    console.error('No se pudo cargar el CV:', e);
    document.querySelector('main').innerHTML =
      '<p class="text-center text-slate-500 py-20">No se pudo cargar el CV. Recarga la página.</p>';
    return;
  }
  await loadVariant();      // si falla, se cae con gracia al CV genérico
  applyLanguage();
})();
</script>
